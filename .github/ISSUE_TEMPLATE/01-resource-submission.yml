name: 投稿资料
description: 提交有权公开的课程笔记、复习总结、习题、试卷回忆版或实验资料
title: "[资料投稿] "
labels: ["投稿", "待审核"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你愿意把资料留给后来的人。请勿直接提交含隐私信息或权利不明的文件；维护者会在公开前进行审核。
  - type: input
    id: course
    attributes:
      label: 课程名称
      placeholder: 例如：数据库
    validations:
      required: true
  - type: dropdown
    id: resource-type
    attributes:
      label: 资料类型
      options:
        - 个人整理笔记
        - 复习总结
        - 习题资料
        - 历年试卷或学生回忆版
        - 实验资料
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 资料说明
      description: 请说明资料内容、格式、适用范围和获取方式；如需通过私密渠道交付，请勿在公开 Issue 中留下个人联系方式。
    validations:
      required: true
  - type: dropdown
    id: authorship
    attributes:
      label: 权利与来源
      options:
        - 我是原创作者，有权授权本站公开
        - 已获得原创作者或权利人的明确授权
        - 其他，需要维护者进一步核实
    validations:
      required: true
  - type: input
    id: attribution
    attributes:
      label: 署名方式
      description: 可填写希望展示的姓名或昵称；如无需署名请填写“不署名”。
    validations:
      required: true
  - type: checkboxes
    id: confirmations
    attributes:
      label: 投稿确认
      options:
        - label: 我确认资料不包含姓名、学号、成绩、联系方式等未脱敏个人信息。
          required: true
        - label: 我确认资料不是未授权教师课件、教材扫描件、付费资料、内部题库或尚未举行考试的题目。
          required: true
        - label: 我理解投稿不会自动发布，维护者可因版权、隐私、重复或质量问题拒绝收录。
          required: true
